services:
   app:
      build: .
      container_name: fiber_app
      ports:
       - "3000:3000"
      restart: always
      depends_on:
       - db

   db:
      image: postgres:15
      environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: mydb
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:

     
